<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="250" viewBox="0 0 1000 250" role="img" aria-labelledby="t d">
  <title id="t">Reliable delivery loop</title><desc id="d">A four-stage engineering delivery loop from ingest to monitored output.</desc>
  <rect width="1000" height="250" rx="24" fill="#0f1c27"/>
  <text x="42" y="48" fill="#f4fbf8" font-family="Arial,sans-serif" font-size="22" font-weight="700">From messy input to reliable output</text>
  <text x="42" y="74" fill="#91aaa9" font-family="Arial,sans-serif" font-size="14">A repeatable delivery pattern across document AI, automation, and data systems.</text>
  <g font-family="Arial,sans-serif" font-size="14">
    <g transform="translate(42 116)"><rect width="190" height="82" rx="14" fill="#162b35" stroke="#7ce7c1"/><text x="18" y="31" fill="#7ce7c1" font-weight="700">01  INGEST</text><text x="18" y="57" fill="#d7ebe6">files • webhooks • APIs</text></g>
    <g transform="translate(278 116)"><rect width="190" height="82" rx="14" fill="#162b35" stroke="#62b9ff"/><text x="18" y="31" fill="#62b9ff" font-weight="700">02  STRUCTURE</text><text x="18" y="57" fill="#d7ebe6">schemas • validation • ETL</text></g>
    <g transform="translate(514 116)"><rect width="190" height="82" rx="14" fill="#162b35" stroke="#c5a7ff"/><text x="18" y="31" fill="#c5a7ff" font-weight="700">03  REASON</text><text x="18" y="57" fill="#d7ebe6">retrieval • models • rules</text></g>
    <g transform="translate(750 116)"><rect width="190" height="82" rx="14" fill="#162b35" stroke="#ffca7a"/><text x="18" y="31" fill="#ffca7a" font-weight="700">04  DELIVER</text><text x="18" y="57" fill="#d7ebe6">tests • monitoring • API</text></g>
  </g>
  <path d="M232 157h46M468 157h46M704 157h46" stroke="#8bbab6" stroke-width="2" stroke-dasharray="6 6"/>
</svg>
